<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tsunami · Shallow Water</title>
<link rel="stylesheet" href="../common.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="vignette"></div>

<header>
  <div class="kicker">Shallow water equations</div>
  <h1>Tsunami</h1>
  <div class="sub"><span id="dims"></span> · <span id="status">loading…</span></div>
</header>

<details id="panel" class="glass" open>
  <summary>View</summary>
  <label>Shading
    <select data-k="mode"><option value="real">Photoreal</option><option value="eta">Surface elevation η</option></select>
  </label>
  <label>Vertical exaggeration <output></output><input type="range" data-k="vexag" min="1" max="20" step="0.1"></label>
  <label>Wave exaggeration (offshore) <output></output><input type="range" data-k="wexag" min="1" max="20" step="0.1"></label>
  <label>Sun <output></output><input type="range" data-k="sun" min="0" max="1" step="0.01"></label>
  <label>Water clarity <output></output><input type="range" data-k="clarity" min="0.1" max="3" step="0.01"></label>
  <label>Foam <output></output><input type="range" data-k="foam" min="0" max="2" step="0.01"></label>
  <label class="check"><input type="checkbox" data-k="autorotate"> Auto-rotate</label>
  <p class="hint">Drop <b>h.npy</b> (T, Ny, Nx) water depth + <b>b.npy</b> (Ny, Nx) bed elevation [+ meta.json], or open with <code>?data=dir/</code>.</p>
</details>

<div id="timeline" class="glass">
  <button id="play" aria-label="Pause">❚❚</button>
  <span id="time">—</span>
  <div class="track"><canvas id="spark" title="max offshore surface elevation"></canvas><input id="scrub" type="range" min="0" max="0" step="any" value="0" aria-label="Time"></div>
  <select id="speed" aria-label="Playback speed"><option value="6">0.5×</option><option value="12" selected>1×</option><option value="24">2×</option><option value="48">4×</option></select>
</div>
<div id="drop">Drop .npy files</div>

<script type="module">
import { TsunamiEngine } from './engine.js';
import { tsunamiDemo } from './demo.js';
import { Player, loadFromUrl, onDrop, splitFrames, bindPanel, status } from '../common.js';

const engine = new TsunamiEngine(document.getElementById('view'));
const player = new Player();
let bed, etaMax = 0, session = 0;
engine.onFrame = sec => { player.advance(sec); const s = player.sample(); if (s) engine.setFrames(...s); };
bindPanel(engine.params, k => (k === 'sun' ? engine.updateSun() : engine.applyParams()));

const setParam = (k, v) => { const el = document.querySelector(`[data-k=${k}]`); el.value = v; el.dispatchEvent(new Event('input')); };
const km = m => (m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${m.toFixed(0)} m`);

function start(b, nx, ny, meta = {}) {
  bed = b; etaMax = 0;
  engine.setBathymetry(b, nx, ny, meta);
  document.querySelector('[data-k=vexag]').max = Math.ceil(engine.autoVexag * 4);
  setParam('vexag', meta.vexag ?? +engine.autoVexag.toFixed(1));
  setParam('wexag', meta.wexag ?? 1);
  player.reset(meta.dt ?? 1, meta.time_unit ?? 's');
  document.querySelector('h1').textContent = meta.title ?? 'Shallow water';
  document.getElementById('dims').textContent = `${nx}×${ny} · ${km(meta.lx ?? nx)} × ${km(meta.ly ?? ny)}`;
  // deep-link any view param, e.g. ?sun=0.6&mode=eta&t=120 (t = frame index, pauses)
  const q = new URLSearchParams(location.search);
  for (const [k, v] of q) if (k in engine.params) {
    const el = document.querySelector(`[data-k=${k}]`);
    if (el.type === 'checkbox') { el.checked = v !== '0'; el.dispatchEvent(new Event('input')); } else setParam(k, v);
  }
  if (q.has('t')) { player.t = +q.get('t'); player.playing = false; }
  return ++session;
}

// one timestep of water depth h (Float32Array, ny*nx). Also the hook for live solvers: window.viz.push(h)
function push(h) {
  let m = 0;
  for (let i = 0; i < h.length; i++) if (bed[i] < 0 && h[i] > 0 && bed[i] + h[i] > m) m = bed[i] + h[i];
  etaMax = Math.max(etaMax, m);
  engine.etaMax = etaMax;
  player.push(h, m);
  status(`${player.frames.length} frames`);
}

function ingest(hArr, bArr, meta) {
  try {
    const { nx, ny, frames } = splitFrames(hArr);
    let b = bArr?.data;
    if (b && (bArr.shape[0] !== ny || bArr.shape[1] !== nx)) throw new Error(`b is (${bArr.shape}) but h frames are (${ny}, ${nx})`);
    if (!b) { // no bed given: flat bottom at the mean initial depth, sea level 0
      let s = 0; for (const v of frames[0]) s += v;
      b = new Float32Array(nx * ny).fill(-s / (nx * ny));
    }
    start(b, nx, ny, meta);
    frames.forEach(push);
  } catch (e) { status(e.message, true); }
}

function demo() {
  const d = tsunamiDemo(), s = start(d.b, d.nx, d.ny, d.meta);
  let k = 0;
  (function gen() {
    if (s !== session) return;
    for (let n = 0; n < 6 && k < d.count; n++) push(d.frame(k++));
    if (k < d.count) requestAnimationFrame(gen);
  })();
}

window.viz = { engine, player, start, push };
onDrop(d => (d.frames ? ingest(d.frames, d.static, d.meta) : status('drop an h.npy shaped (T, Ny, Nx)', true)));
const url = await loadFromUrl(['h', 'b']).catch(e => (status(e.message, true), undefined));
if (url?.h) ingest(url.h, url.b, url.meta);
else if (url === null) demo();
else if (url) status('no h.npy in ?data dir', true);
</script>
</body>
</html>
